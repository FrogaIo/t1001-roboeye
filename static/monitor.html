<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050807" />
    <title>RoboEye · Mac Monitor</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        background: #050807;
        color: #eaffef;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { display: grid; grid-template: 46px 1fr / minmax(0, 1fr) 340px; background: #020302; }
      header {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
        background: #071009;
        border-bottom: 1px solid #18351f;
        font-size: 12px;
        letter-spacing: 0.08em;
      }
      header strong { color: #38ff75; }
      #connection::before { content: "● "; color: #ff4b4b; }
      #connection.online::before { color: #38ff75; }
      #stage { min-width: 0; min-height: 0; position: relative; overflow: hidden; background: #000; }
      #stream { display: none; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
      #waiting { position: absolute; inset: 0; display: grid; place-content: center; margin: 0; color: #718076; text-align: center; line-height: 1.7; }
      aside { min-height: 0; overflow-y: auto; padding: 16px; background: #071009; border-left: 1px solid #18351f; }
      .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
      .card { min-width: 0; padding: 11px; border: 1px solid #1c3822; background: #09140c; }
      .card small, h2 { display: block; margin: 0 0 7px; color: #718076; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
      .card strong { font-size: 20px; color: #38ff75; }
      .card.stop strong { color: #ff5656; }
      h2 { margin-top: 18px; }
      .lanes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
      .lane { padding: 8px 4px; text-align: center; font-size: 10px; border: 1px solid #2d6240; color: #38ff75; }
      .lane.busy { border-color: #8e2c2c; color: #ff6565; background: rgba(255, 50, 50, .08); }
      ul { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
      li { padding: 8px; border-left: 2px solid #2d6240; background: #09120b; font-size: 11px; line-height: 1.4; }
      li.danger { border-color: #ff4b4b; }
      .muted { color: #718076; }
      .event-time { color: #8fa296; margin-right: 7px; }
      .event-stop { color: #ff6565; }
      .event-go { color: #38ff75; }
      a { color: #ffd44b; }
      @media (max-width: 900px) {
        body { grid-template: 42px minmax(0, 58vh) minmax(0, 1fr) / 1fr; overflow: auto; }
        header { grid-column: 1; }
        aside { border-left: 0; border-top: 1px solid #18351f; }
      }
    </style>
  </head>
  <body>
    <header>
      <strong>ROBOEYE · MAC OPERATOR</strong>
      <span id="connection">ожидание телефона</span>
    </header>
    <main id="stage">
      <img id="stream" alt="Обработанный поток с камеры телефона" />
      <p id="waiting">Откройте главную страницу на телефоне<br />и включите камеру</p>
    </main>
    <aside>
      <div class="hero">
        <div id="stateCard" class="card"><small>Робот</small><strong id="robotState">—</strong></div>
        <div class="card"><small>Маршрут</small><strong id="route">—</strong></div>
        <div class="card"><small>Причина</small><span id="reason">—</span></div>
        <div class="card"><small>Инференс</small><span id="inference">—</span></div>
        <div class="card"><small>Наклон камеры</small><span id="tilt">—</span></div>
      </div>

      <h2>Секторы</h2>
      <div class="lanes">
        <div id="lane-left" class="lane">LEFT</div>
        <div id="lane-center" class="lane">CENTER</div>
        <div id="lane-right" class="lane">RIGHT</div>
      </div>

      <h2>Объекты в кадре</h2>
      <ul id="detections"><li class="muted">Нет данных</li></ul>

      <h2>Журнал состояний</h2>
      <ul id="events"><li class="muted">Событий пока нет</li></ul>
    </aside>
    <script>
      const image = document.querySelector("#stream");
      const waiting = document.querySelector("#waiting");
      const connection = document.querySelector("#connection");
      const stateCard = document.querySelector("#stateCard");
      const robotState = document.querySelector("#robotState");
      const route = document.querySelector("#route");
      const reason = document.querySelector("#reason");
      const inference = document.querySelector("#inference");
      const tilt = document.querySelector("#tilt");
      const detections = document.querySelector("#detections");
      const events = document.querySelector("#events");

      function requestFrame() { image.src = `/latest.jpg?t=${Date.now()}`; }
      image.onload = () => {
        image.style.display = "block";
        waiting.style.display = "none";
        window.setTimeout(requestFrame, 333);
      };
      image.onerror = () => window.setTimeout(requestFrame, 500);

      function renderStatus(data) {
        connection.classList.toggle("online", data.connected);
        connection.textContent = data.connected ? "телефон подключён" : "ожидание телефона";

        if (data.status) {
          const status = data.status;
          robotState.textContent = status.state;
          stateCard.classList.toggle("stop", status.state === "STOP");
          route.textContent = status.route;
          reason.textContent = status.reason_display;
          inference.textContent = `${status.inference_ms} ms`;
          tilt.textContent = `${status.pitch_degrees}°`;
          for (const lane of ["left", "center", "right"]) {
            document.querySelector(`#lane-${lane}`).classList.toggle("busy", status.lanes[lane]);
          }
          detections.innerHTML = status.detections.length
            ? status.detections.map((item) =>
                `<li class="${item.dangerous ? "danger" : ""}"><strong>${item.display_name}</strong> ${Math.round(item.confidence * 100)}%<br><span class="muted">${item.lane} · ${item.close ? "близко" : "далеко"}</span></li>`
              ).join("")
            : '<li class="muted">Препятствий не найдено</li>';
        } else {
          robotState.textContent = "—";
          route.textContent = "—";
          reason.textContent = "—";
          inference.textContent = "—";
          tilt.textContent = "—";
        }

        events.innerHTML = data.events.length
          ? data.events.slice(0, 12).map((event) => {
              const incident = event.incident
                ? `<br><a href="/incidents/${event.incident}" target="_blank">кадр инцидента</a>`
                : "";
              return `<li><span class="event-time">${event.time}</span><strong class="${event.to === "STOP" ? "event-stop" : "event-go"}">${event.from} → ${event.to}</strong><br><span class="muted">${event.reason} · route ${event.route}</span>${incident}</li>`;
            }).join("")
          : '<li class="muted">Событий пока нет</li>';
      }

      async function refreshStatus() {
        try {
          const response = await fetch(`/api/status?t=${Date.now()}`, { cache: "no-store" });
          renderStatus(await response.json());
        } catch {
          connection.classList.remove("online");
          connection.textContent = "сервер недоступен";
        }
        window.setTimeout(refreshStatus, 333);
      }

      requestFrame();
      refreshStatus();
    </script>
  </body>
</html>
