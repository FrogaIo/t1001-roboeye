<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050807" />
    <title>RoboEye · Phone Camera</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main>
      <video id="camera" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
      <canvas id="capture"></canvas>

      <aside class="side-panel side-panel-left">
        <div class="brand">ROBO<span>EYE</span></div>
        <div id="status">не подключено</div>
      </aside>

      <aside class="side-panel side-panel-right">
        <div class="robot-state">
          <small>ROBOT</small>
          <strong id="robotState">—</strong>
          <span id="reason">ожидание</span>
          <span id="route">маршрут —</span>
          <span id="source">источник —</span>
        </div>
        <div id="ping">PING —</div>
        <button id="stop" hidden aria-label="Остановить трансляцию">■</button>
      </aside>

      <section id="welcome">
        <div class="logo">ROBO<span>EYE</span></div>
        <p>Камера телефона → обработка на Mac → обратно на телефон</p>
        <button id="start">Включить камеру</button>
        <small>Разрешите доступ к задней камере после нажатия</small>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
